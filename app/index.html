<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Heightmap Generator</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      canvas { display: block; }
      #preview {
        position: fixed; left: 12px; bottom: 12px;
        width: 260px; height: 260px;
        border: 1px solid #3a4150; border-radius: 8px;
        box-shadow: 0 4px 16px rgb(0 0 0 / 0.4);
        z-index: 10;
      }
      /* Panel: Toolbar + Tabs + lil-gui je Tab (→ Plan/UI.md), Farben wie lil-gui */
      #panel {
        position: fixed; top: 0; right: 0; width: 300px; max-height: 100vh;
        display: flex; flex-direction: column;
        background: #1f1f1f; color: #ebebeb;
        font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        box-shadow: -4px 0 16px rgb(0 0 0 / 0.4); z-index: 20;
      }
      #panel .toolbar { padding: 6px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #333; }
      #panel .row { display: flex; gap: 4px; align-items: center; }
      #panel .row > label { width: 32px; }
      #panel input, #panel select, #panel button {
        font: inherit; color: inherit; background: #2c2c2c; border: 1px solid #3a3a3a;
        border-radius: 3px; height: 22px; padding: 0 6px;
      }
      #panel input#seed { flex: 1; min-width: 0; }
      #panel select { flex: 1; min-width: 0; cursor: pointer; }
      #panel select#exportRes { flex: 0 0 80px; }
      #panel button { cursor: pointer; }
      #panel button:hover, #panel select:hover { background: #3a3a3a; }
      #panel button:disabled { opacity: 0.4; cursor: default; }
      #panel #status { min-height: 14px; color: #9a9a9a; font-variant-numeric: tabular-nums; }
      #panel #status.busy { color: #2cc9ff; }
      #panel .tabs { display: flex; border-bottom: 1px solid #333; }
      #panel .tabs button {
        flex: 1; height: 28px; border: 0; border-radius: 0; background: none;
        border-bottom: 2px solid transparent; font-weight: 600;
      }
      #panel .tabs button.active { border-bottom-color: #2cc9ff; color: #fff; }
      #panel .tab-body { overflow-y: auto; }
      #panel .tab-gui > .lil-title { display: none; }
      /* Seed-Vergleich (→ Plan/Roadmap.md R13): über 3D + Preview, Panel bleibt bedienbar */
      #seedGrid {
        position: fixed; inset: 0 300px 0 0; z-index: 15;
        display: flex; flex-direction: column;
        background: rgb(14 17 22 / 0.94); color: #ebebeb;
        font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #seedGrid .bar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #333; }
      #seedGrid .bar span { flex: 1; color: #9a9a9a; }
      #seedGrid button {
        font: inherit; color: inherit; background: #2c2c2c; border: 1px solid #3a3a3a;
        border-radius: 3px; height: 22px; padding: 0 8px; cursor: pointer;
      }
      #seedGrid button:hover { background: #3a3a3a; }
      #seedGrid .grid {
        flex: 1; overflow-y: auto; padding: 12px;
        display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; align-content: start;
      }
      #seedGrid .tile { height: auto; padding: 4px; display: flex; flex-direction: column; gap: 4px; }
      #seedGrid .tile canvas { width: 100%; aspect-ratio: 1; background: #1a1d24; border-radius: 2px; }
      #seedGrid .tile:hover { border-color: #2cc9ff; }
    </style>
  </head>
  <body>
    <canvas id="preview" width="1024" height="1024"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
