name: Feature request
description: An idea for a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What do you need it for?
      description: Your game or use case helps to get it right.
  - type: dropdown
    id: engine
    attributes:
      label: Engine / tool you use
      multiple: true
      options:
        - Unreal Engine
        - Unity
        - Godot
        - three.js / Web
        - Blender / Houdini / other
